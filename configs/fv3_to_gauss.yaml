states to structured grid:
- state geometry:
    fms initialization:
      namelist filename: fv3-jedi/fix/fmsmpp.nml
      field table filename: fv3-jedi/fix/field_table
    akbk: fv3-jedi/fix/akbk.nc4
    layout:
      - 3
      - 2
    npx: 385
    npy: 385
    npz: 127
  state:
    datapath: fv3-jedi/bkg
    filetype: cube sphere history
    provider: ufs
    datetime: '2025-08-03T00:00:00Z'
    filenames:
    - gdas.t18z.cubed_sphere_grid_atmf006.nc
    - gdas.t18z.cubed_sphere_grid_sfcf006.nc
    max allowable geometry difference: 1e-4
    state variables:
    - eastward_wind
    - northward_wind
    - air_temperature
    - air_pressure_thickness
    - air_pressure_at_surface
    - water_vapor_mixing_ratio_wrt_moist_air
    - cloud_liquid_ice
    - cloud_liquid_water
    - snow_water
    - rain_water
    - graupel
    - cloud_ice_number_concentration
    - rain_number_concentration
    - ozone_mass_mixing_ratio
    - geopotential_height_at_surface
    - slmsk
    - sheleg
    - skin_temperature_at_surface
    - vtype
    - stype
    - vfrac
    - soilt
    - soilm
    - totalSnowDepthMeters
    - eastward_wind_at_surface
    - northward_wind_at_surface
    - f10m
    field io names:
      eastward_wind: ugrd
      northward_wind: vgrd
      air_temperature: tmp
      layer_thickness: delz
      air_pressure_thickness: dpres
      air_pressure_at_surface: pressfc
      water_vapor_mixing_ratio_wrt_moist_air: spfh
      cloud_liquid_ice: icmr
      cloud_liquid_water: clwmr
      snow_water: snmr
      rain_water: rwmr
      graupel: grle
      cloud_ice_number_concentration: nccice
      rain_number_concentration: nconrd
      ozone_mass_mixing_ratio: o3mr
      geopotential_height_at_surface: hgtsfc
      slmsk: land
      sheleg: weasd
      skin_temperature_at_surface: tmpsfc
      stype: sotyp
      vfrac: veg
      totalSnowDepthMeters: snod
      eastward_wind_at_surface: ugrd_hyblev1
      northward_wind_at_surface: vgrd_hyblev1
      soilm: soilw1
      soilt: soilt1

  structured grid interpolation:
    grid type: regular gaussian
    local interpolator type: atlas interpolator
    interpolation method:
      type: finite-element
    number of latitude gridpoints: 192
    variables to output:
    - air_temperature
    - eastward_wind
    - northward_wind
    - slmsk
    - skin_temperature_at_surface
    - air_pressure_at_surface
    - water_vapor_mixing_ratio_wrt_moist_air
    bottom model level: true
    datapath: .
    prefix: atm_gauss
